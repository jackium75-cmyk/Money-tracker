{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>Money Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <link rel="stylesheet" href="{% static 'tracker/app.css' %}">
  <script>try{const t=localStorage.getItem('mt-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-logo">💰</span><span>Money Tracker</span></div>
    <nav class="nav" id="nav">
      <a href="#/dashboard" data-view="dashboard"><span class="ni">📊</span><span>Dashboard</span></a>
      <a href="#/transactions" data-view="transactions"><span class="ni">🧾</span><span>Transactions</span></a>
      <a href="#/income" data-view="income"><span class="ni">💵</span><span>Income</span></a>
      <a href="#/budget" data-view="budget"><span class="ni">🎯</span><span>Budget</span></a>
      <a href="#/goals" data-view="goals"><span class="ni">🏆</span><span>Savings Goals</span></a>
      <a href="#/recurring" data-view="recurring"><span class="ni">🔁</span><span>Recurring</span></a>
      <a href="#/year" data-view="year"><span class="ni">📅</span><span>Year View</span></a>
      <a href="#/settings" data-view="settings"><span class="ni">⚙️</span><span>Settings</span></a>
    </nav>
    <div class="sidebar-foot">
      <div class="live" id="live" title="Changes sync instantly across your open tabs and devices"><span class="dot"></span><span id="live-text">Live</span></div>
      <div class="user-row">
        <span class="avatar" id="avatar">?</span><span id="username" class="truncate"></span>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="icon-btn" title="Sign out">⏻</button></form>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">☰</button>
      <h1 id="view-title">Dashboard</h1>
      <div class="period" id="period">
        <button class="icon-btn" data-step="-1" title="Previous month ( [ )">‹</button>
        <button class="period-label" id="period-label" title="Jump to this month"></button>
        <button class="icon-btn" data-step="1" title="Next month ( ] )">›</button>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="theme-btn" title="Toggle dark mode (D)">🌓</button>
        <button class="icon-btn" id="help-btn" title="Keyboard shortcuts (?)">⌨️</button>
        <button class="btn btn-primary" id="quick-add" title="Add (N)"><span class="plus">＋</span><span class="hide-sm"> Add</span></button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<nav class="bottom-nav" id="bottom-nav">
  <a href="#/dashboard" data-view="dashboard"><span>📊</span><small>Home</small></a>
  <a href="#/transactions" data-view="transactions"><span>🧾</span><small>Spending</small></a>
  <button class="fab" id="fab" aria-label="Add">＋</button>
  <a href="#/budget" data-view="budget"><span>🎯</span><small>Budget</small></a>
  <a href="#/settings" data-view="settings"><span>⚙️</span><small>More</small></a>
</nav>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-inner" id="drawer-body"></div></aside>
<div class="modal-wrap" id="modal-wrap" aria-hidden="true"><div class="modal" id="modal" role="dialog"></div></div>
<div class="toasts" id="toasts"></div>

{% csrf_token %}
<script src="{% static 'tracker/vendor/chart.umd.min.js' %}"></script>
<script src="{% static 'tracker/app.js' %}"></script>
</body>
</html>
