{% extends "tracker/base_auth.html" %}
{% block title %}Sign in · Money Tracker{% endblock %}
{% block content %}
<form method="post" class="auth-form">
  {% csrf_token %}
  {% if form.errors %}<div class="banner banner-danger">Wrong username or password. Please try again.</div>{% endif %}
  <label class="field"><span>Username</span><input name="username" autocomplete="username" autofocus required value="{{ form.username.value|default:'' }}"></label>
  <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn btn-primary btn-block" type="submit">Sign in</button>
</form>
<p class="auth-alt">New here? <a href="{% url 'signup' %}">Create an account</a></p>
{% endblock %}
